[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harbor-omp"
version = "0.3.0"
description = "Harbor agent for omp (oh-my-pi): install, run, and read the session metrics"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evan O'Keefe" }]
keywords = ["harbor", "omp", "oh-my-pi", "agent", "evals", "harness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "harbor>=0.24.0",
  "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/evanokeefe39/harbor-omp"
Issues = "https://github.com/evanokeefe39/harbor-omp/issues"

[dependency-groups]
dev = [
  "import-linter>=2.15",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_omp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.importlinter]
root_package = "harbor_omp"
include_external_packages = true

# The hard rule of this repo (`tests/test_isolation.py` also asserts it): the
# package depends on Harbor's public API and on nothing else. A module added to
# `session.py` — the standalone reader that must load with `harbor` and
# `pydantic` absent — cannot quietly grow a Harbor import. The test suite
# proves the same rule for the whole package; this states it as contracts so a
# boundary a new file would cross fails lint-imports before review.
[[tool.importlinter.contracts]]
name = "harbor_omp.session is standalone — no Harbor, no pydantic"
type = "forbidden"
source_modules = ["harbor_omp.session"]
forbidden_modules = ["harbor", "pydantic"]

[[tool.importlinter.contracts]]
name = "harbor_omp.hooks and harbor_omp.install need no harness"
type = "forbidden"
source_modules = ["harbor_omp.hooks", "harbor_omp.install"]
forbidden_modules = ["harbor", "pydantic"]

[[tool.importlinter.contracts]]
name = "the package names nothing outside its declared dependencies"
type = "forbidden"
source_modules = ["harbor_omp"]
forbidden_modules = ["evals"]
