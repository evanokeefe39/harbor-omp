[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harbor-omp"
version = "0.2.0"
description = "Harbor agent adapter for omp (oh-my-pi): install, run, and read the session metrics"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evan O'Keefe" }]
keywords = ["harbor", "omp", "oh-my-pi", "agent", "evals", "harness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "harbor>=0.24.0",
  "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/evanokeefe39/harbor-omp"
Issues = "https://github.com/evanokeefe39/harbor-omp/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_omp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
